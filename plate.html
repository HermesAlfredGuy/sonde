<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>plate</title>
<link rel="stylesheet" href="styles.css">
<style>
  html, body { margin: 0; padding: 0; background: #060F14; }
  #host svg { max-width: none; display: block; width: var(--plate-w, 2400px); height: var(--plate-h, 6000px); }
  .bare .lbl, .bare .ruler-n { display: none; }
</style>
</head>
<body>
<div id="host"></div>
<script type="module">
  import { buildSection } from './src/geology.js';
  const q = new URLSearchParams(location.search);
  const bare = q.get('bare') === '1';
  const w = Number(q.get('w') || 2400);
  document.documentElement.style.setProperty('--plate-w', w + 'px');
  document.documentElement.style.setProperty('--plate-h', (w * 2.5) + 'px');
  if (bare) document.documentElement.classList.add('bare');
  const svg = buildSection({ h: 3000 });
  svg.removeAttribute('role');
  svg.setAttribute('aria-hidden', 'true');
  svg.style.width = w + 'px';
  svg.style.height = (w * 2.5) + 'px';
  svg.style.position = 'static';
  document.getElementById('host').append(svg);
  document.title = 'plate-ready';
</script>
</body>
</html>
