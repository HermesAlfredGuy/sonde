<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Not found — Sonde</title>
  <meta name="theme-color" content="#131209" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <style>
    :root { --ground:#131209; --ink:#f2f0ec; --ink-2:#a8a49b; --ink-3:#8b8779; --accent:#ffb020; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--ground); color:var(--ink); font:400 16px/1.6 "Geist Variable","Helvetica Neue",Arial,sans-serif; padding:24px; }
    .box { max-width: 520px; }
    .code { font-family: ui-monospace, monospace; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
    h1 { font-size: 40px; letter-spacing: -0.04em; line-height: 1.05; margin: 16px 0 12px; font-weight: 500; }
    p { color: var(--ink-2); margin: 0 0 24px; }
    a { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 22px; border-radius: 999px; background: var(--accent); color: #1a1206; text-decoration: none; font-size: 14px; font-weight: 500; }
  </style>
</head>
<body>
  <div class="box">
    <p class="code">404 · no rows returned</p>
    <h1>That page is not in the schema.</h1>
    <p>The address you asked for does not exist. The console is still where you left it.</p>
    <a href="/">Back to Sonde</a>
  </div>
</body>
</html>
